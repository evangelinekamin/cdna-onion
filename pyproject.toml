[project]
name = "onionrig"
version = "0.1.0"
description = "Conformance and benchmark rig for Tor v3 vanity .onion generators (ed25519 throughput research on AMD CDNA)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pynacl>=1.5"]

[project.scripts]
onionrig = "onionrig.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onionrig"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7", "cryptography>=42"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs external tools (tor, GPU toolchains)"]

[tool.coverage.run]
source = ["onionrig"]
branch = true
